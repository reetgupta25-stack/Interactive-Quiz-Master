
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master | Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">Quiz Master</h2>
            <a href="index.html" class="nav-link">Home</a>
        </nav>
    </header>

    <main class="results-container">

        <div class="results-card">

            <div class="result-icon">🏆</div>

            <span class="tagline">QUIZ COMPLETED</span>

            <h1>Great Job!</h1>

            <p class="result-message">
                You have successfully completed the quiz.
            </p>

            <div class="score-circle">
                <h2 id="final-score">0/10</h2>
                <p>Your Score</p>
            </div>

            <h3 id="performance">Keep Practicing!</h3>

            <p id="percentage">You scored 0%</p>

            <div class="result-buttons">
                <button id="restart-btn" class="restart-btn">
                    Restart Quiz
                </button>

                <a href="index.html" class="home-btn">
                    Back to Home
                </a>
            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 Quiz Master. Learn something new every day.</p>
    </footer>

    <script src="results.js"></script>

</body>
</html>
